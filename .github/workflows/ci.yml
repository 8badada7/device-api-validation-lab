name: HTTP API validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      NO_PROXY: "127.0.0.1,localhost"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest with managed DUT
        run: python scripts/run_ci_tests.py

      - name: Upload JUnit report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/pytest-results.xml
          if-no-files-found: error
          retention-days: 7

      - name: Upload JSON fault evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: fault-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/evidence/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload main DUT log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: main-dut-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/ci_dut.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload Recovery DUT logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: recovery-dut-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/recovery_dut_*.log
          if-no-files-found: error
          retention-days: 7
